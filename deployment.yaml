apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-java-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-java-demo
  template:
    metadata:
      labels:
        app: devops-java-demo
    spec:
      containers:
        - name: devops-java-demo
          image: vishal984/devops-java-demo:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: devops-java-demo-service
spec:
  type: NodePort
  selector:
    app: devops-java-demo
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
